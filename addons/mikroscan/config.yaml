name: "Mikroscan"
description: >-
  Interactive MikroTik topology mapping UI and live refresh service.
version: "0.1.19"
slug: "mikroscan"
url: "https://github.com/kitsok/mikroscan"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: Mikroscan
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  backend: api
  api_port: 8728
  ssh_port: 22
  refresh_interval: 60
  scan_range: ""
  api_ssl: false
  verbose: false
  device_username: ""
  device_password: ""
schema:
  backend: list(api|ssh)
  api_port: port
  ssh_port: port
  refresh_interval: int(0,)
  scan_range: str?
  api_ssl: bool
  verbose: bool
  device_username: str?
  device_password: password?
