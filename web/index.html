<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mikroscan Topology</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="eyebrow">Mikroscan</div>
        <h1>Topology Map</h1>
        <div class="build-id">build 7b4f4bd</div>
        <p class="lede">Interactive physical tree built from the current topology model.</p>
      </div>

      <section class="panel actions">
        <div class="panel-title">Actions</div>
        <div class="action-grid">
          <button id="refresh-topology" class="icon-button" type="button" title="Reload topology" aria-label="Reload topology">
            <span class="icon" aria-hidden="true">&#8635;</span>
            <span class="button-label">Reload</span>
          </button>
          <button id="generate-topology" class="icon-button" type="button" title="Regenerate topology" aria-label="Regenerate topology">
            <span class="icon" aria-hidden="true">&#916;</span>
            <span class="button-label">Build</span>
          </button>
          <button id="scan-network" class="icon-button" type="button" title="Refresh from devices" aria-label="Refresh from devices">
            <span class="icon" aria-hidden="true">&#9673;</span>
            <span class="button-label">Scan</span>
          </button>
          <button id="reset-layout" class="icon-button" type="button" title="Reset layout" aria-label="Reset layout">
            <span class="icon" aria-hidden="true">&#8864;</span>
            <span class="button-label">Reset</span>
          </button>
        </div>
        <label class="field">
          <span>Scan range</span>
          <input id="scan-range" type="text" placeholder="192.168.1.0/24">
        </label>
      </section>

      <section class="panel status">
        <div class="panel-title">Status</div>
        <dl id="status-grid" class="status-grid"></dl>
      </section>

      <section class="panel details">
        <div class="panel-title">Selected Node</div>
        <div id="node-details" class="details-body">Click a node to inspect it.</div>
      </section>

      <section class="panel unresolved">
        <div class="panel-title">Unresolved Hosts</div>
        <div id="unresolved-hosts" class="unresolved-list">No unresolved hosts.</div>
      </section>
    </aside>

    <main class="workspace">
      <div class="workspace-header">
        <div>
          <div class="eyebrow">Map</div>
          <h2 id="map-title">Current topology</h2>
        </div>
        <div class="hint">Click inspect. Double-click collapse. Drag move.</div>
      </div>

      <div id="canvas-wrapper" class="canvas-wrapper">
        <svg id="edge-layer" class="edge-layer"></svg>
        <div id="node-layer" class="node-layer"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
